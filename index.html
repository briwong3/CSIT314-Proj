<style>

*{box-sizing:border-box}body{margin:0;font:15px 'DM Sans',sans-serif;color:var(--ink);background:var(--bg)}

td button{margin-right:4px;padding:4px 10px}.danger{background:#e8a5a5}
form.stack{display:grid;gap:10px;max-width:360px}form.stack .field{display:grid;gap:6px}form.stack label{font-weight:500;color:var(--ink);font-size:15px;line-height:1.35}form.stack input{width:100%;height:38px;padding:9px 10px}form.stack button.btn{margin-top:4px;width:100%;height:42px;padding:10px 14px;background:var(--gold);border-radius:8px;border:1px solid rgba(59,74,107,.12);font-weight:600}.auth-links{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;color:#2e3547;font-size:15px;line-height:1.5}.auth-links a{color:var(--ink);text-decoration:none;cursor:pointer}.auth-links a:hover{text-decoration:underline}pre.term{background:#14171f;color:#9fe3a8;padding:16px;border-radius:12px;overflow:auto;max-height:480px;font:13px ui-monospace,monospace}
.err{color:#b3261e}a{color:var(--navy);cursor:pointer;text-decoration:underline}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.landing-header{min-height:48px;padding:8px max(24px,calc((100% - 1120px)/2));gap:24px;flex-wrap:nowrap}.landing-header b{font-size:16px;white-space:nowrap}.landing-header nav{gap:18px;flex:1}.landing-header nav a,.landing-header nav .nav-coming-soon{color:#fff;text-decoration:none;font-size:13px;white-space:nowrap}.landing-header nav a:hover{text-decoration:underline}.landing-header nav .nav-coming-soon{opacity:.62;cursor:default}.landing-header #who{display:flex;gap:8px;white-space:nowrap}.landing-header #who .btn{font-size:13px;padding:7px 14px;background:#fff;color:var(--navy)}.landing-header #who .btn:first-child{background:transparent;color:#fff;border:1px solid #ffffff80}
main.home-main{max-width:none;margin:0;padding:0}.homepage{background:var(--bg)}.home-wrap{width:min(1120px,calc(100% - 48px));margin:0 auto}.home-hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:44px;padding-top:56px;padding-bottom:52px}.home-hero h1{max-width:520px;margin:0 0 14px;font-size:clamp(32px,4vw,48px);line-height:1.08;letter-spacing:-.035em}.home-hero-copy>p:not(.eyebrow){max-width:490px;color:#60677b;line-height:1.65;margin:0 0 24px}.eyebrow{margin:0 0 10px;color:var(--navy);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.home-search{display:grid;grid-template-columns:1.2fr 1fr auto;align-items:end;gap:10px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #3b4a6b0d}.home-search label{display:grid;gap:6px;color:#555c70;font-size:12px}.home-search input,.home-search select{min-width:0;width:100%;height:40px}.home-search .btn{height:40px;padding:0 18px;background:var(--navy);color:#fff}.popular-topics{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;color:#687087;font-size:12px}.popular-topics button{padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--navy);font:inherit;cursor:pointer}.popular-topics button:hover{border-color:var(--navy)}
.home-gallery{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:150px 150px;gap:12px}.photo-placeholder{position:relative;display:flex;align-items:flex-end;min-height:112px;overflow:hidden;border-radius:12px;background:#cfe3dd}.photo-placeholder:nth-child(2){background:#eadcc9}.photo-placeholder:nth-child(3){grid-column:1/3;background:#dfe5ca}.photo-placeholder span{margin:10px;padding:3px 8px;border-radius:99px;background:#fff;color:#687087;font-size:10px}
.home-section{padding:38px 0}.home-section h2{margin:0 0 5px;font-size:26px;letter-spacing:-.02em}.section-subtitle{margin:0 0 22px;color:#6b7087;font-size:14px}.category-grid,.project-grid,.steps-grid,.designer-grid{display:grid;gap:18px}.category-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.category-card,.project-card,.step-card,.designer-card{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px}.category-card{color:var(--ink);text-decoration:none}.category-card .photo-placeholder{height:128px;min-height:0;border-radius:0}.category-card:nth-child(2) .photo-placeholder,.project-card:nth-child(2) .photo-placeholder{background:#cdd7e2}.category-card:nth-child(3) .photo-placeholder,.project-card:nth-child(3) .photo-placeholder{background:#ead2d2}.category-card:nth-child(4) .photo-placeholder{background:#d8d2e6}.category-card strong{display:block;padding:12px 14px;font-size:14px}.section-heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.section-heading .section-subtitle{margin:0}.text-link{color:var(--navy);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}.project-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.project-card .photo-placeholder{height:142px;min-height:0;border-radius:0}.project-info{padding:14px}.project-tag{margin:0 0 6px;color:var(--navy);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.project-info h3{margin:0 0 4px;font-size:16px}.project-info p{margin:0;color:#6b7087;font-size:12px}.project-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#6b7087;font-size:11px}.save-btn{padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--navy);font:inherit;cursor:pointer}.save-btn:hover{border-color:var(--navy)}
.steps-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.step-card{padding:20px}.step-number{display:grid;place-items:center;width:34px;height:34px;margin-bottom:14px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;font-weight:700}.step-card h3{margin:0 0 7px;font-size:16px}.step-card p{margin:0;color:#6b7087;font-size:13px;line-height:1.6}.designer-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.designer-card{display:flex;align-items:center;gap:14px;padding:16px}.designer-avatar{flex:0 0 48px;width:48px;height:48px;border-radius:50%;background:#cfe3dd}.designer-card:nth-child(2) .designer-avatar{background:#cdd7e2}.designer-card:nth-child(3) .designer-avatar{background:#dfe5ca}.designer-card h3{margin:0 0 4px;font-size:15px}.designer-card p{margin:0;color:#6b7087;font-size:12px;line-height:1.45}.designer-card a{color:inherit;text-decoration:none}.designer-card a:hover{text-decoration:underline}
.designer-cta{padding:38px 0;background:var(--navy);color:#fff}.designer-cta .home-wrap{display:flex;justify-content:space-between;align-items:center;gap:24px}.designer-cta h2{margin:0 0 6px;font-size:24px}.designer-cta p{margin:0;color:#e2e6ef;font-size:14px}.designer-cta .btn{background:#fff;color:var(--navy);white-space:nowrap}.site-footer{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px max(24px,calc((100% - 1120px)/2));background:#fff;color:#6b7087;font-size:12px}.site-footer a{color:var(--navy);text-decoration:none}.footer-brand{color:var(--navy);font-weight:700;letter-spacing:.12em}
@media(max-width:760px){.landing-header{padding:10px 16px;gap:12px;flex-wrap:wrap}.landing-header nav{order:3;flex-basis:100%;overflow:auto}.landing-header nav a{font-size:12px}.landing-header #who{margin-left:auto}.home-wrap{width:min(100% - 32px,560px)}.home-hero{grid-template-columns:1fr;gap:28px;padding-top:38px;padding-bottom:32px}.home-gallery{grid-template-rows:120px 120px}.category-grid,.project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.steps-grid{grid-template-columns:1fr}.designer-grid{grid-template-columns:1fr}.home-section{padding:28px 0}.home-section h2{font-size:23px}.designer-cta .home-wrap{align-items:flex-start;flex-direction:column}.site-footer{padding:20px 16px;flex-wrap:wrap}.home-search{grid-template-columns:1fr 1fr}.home-search .btn{grid-column:1/-1}}@media(max-width:420px){.home-search{grid-template-columns:1fr}.home-search .btn{grid-column:auto}.category-grid,.project-grid{gap:10px}.category-card .photo-placeholder,.project-card .photo-placeholder{height:100px}.project-info{padding:10px}.project-info h3{font-size:14px}.project-meta{align-items:flex-end}.home-gallery{grid-template-rows:100px 100px}.section-heading{align-items:flex-start;flex-direction:column}}
</style>
<style>
header.auth-header{height:56px;min-height:56px;padding:0 34px;gap:0;flex-wrap:nowrap}

.auth-card{width:min(100%,382px);padding:28px;border:1px solid #dce0ed;border-radius:12px;background:#fff}

.auth-success{margin:0 0 14px;padding:10px 11px;border:1px solid #9ac5a2;border-radius:8px;background:#f0f8f1;color:#246236;font-size:12px;line-height:1.4}
.auth-main .auth-message:not(:empty):not(.err):not(.auth-success){margin:0 0 14px;padding:10px 11px;border:1px solid #d4d9e7;border-radius:8px;background:#f5f6fa;color:#475675;font-size:12px;line-height:1.4}
[hidden]{display:none!important}

.messages-empty,.thread-placeholder{padding:22px;color:#6b7087;font-size:13px;line-height:1.5}
.thread-placeholder{display:grid;align-content:center;justify-items:center;text-align:center;background:var(--bg)}

.feedback-status.resolved{background:#e8eaf2}
.feedback-actions{display:flex;gap:7px;align-items:center}
.feedback-action{min-height:36px;padding:0 12px;border:1px solid #8995aa;border-radius:8px;background:#fff;color:#344158;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.feedback-action:disabled{opacity:.55;cursor:wait}
.feedback-empty{text-align:center!important;padding:30px 8px!important;color:#6b7484!important}
.feedback-error:not(:empty){margin:12px 0 0}
.feedback-dialog{width:min(520px,calc(100% - 32px))}
.feedback-dialog-content{display:grid;gap:15px;padding:24px}
.feedback-dialog-content h2{margin:0;font-size:22px}
.feedback-full-message{margin:0;padding:14px;border:1px solid #e0e4eb;border-radius:9px;background:#f7f8fa;color:#37445b;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.feedback-dialog .account-edit-actions .btn{min-height:40px;background:var(--navy);color:#fff}
.feedback-dialog .account-edit-actions .secondary-btn{border:1px solid var(--navy);background:#fff;color:var(--navy)}
.report-page{display:grid;align-content:start;gap:16px}
.report-heading h1{margin:0 0 5px;font-size:32px;letter-spacing:-.04em}
.report-heading p{margin:0;color:#687087;font-size:14px}
.report-datebar{display:flex;justify-content:space-between;align-items:end;gap:14px;padding:12px 14px;border:1px solid #dfe3eb;border-radius:10px;background:#fff}
.report-date-controls{display:grid;gap:5px}
.report-date-controls>label{color:#536079;font-size:12px}
.report-date-inputs{display:flex;align-items:center;gap:8px}
.report-date-inputs input{width:180px;height:40px}
.report-outline-button{min-height:40px;padding:0 14px;border:1px solid #9ba8bd;border-radius:8px;background:#fff;color:#344158;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.report-outline-button:hover{background:#f4f6fa}
.report-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.report-stat{display:grid;gap:3px;min-height:82px;padding:14px;border:1px solid #dfe3eb;border-radius:10px;background:#fff}
.report-stat span,.report-stat small{color:#687087;font-size:12px}
.report-stat strong{font-size:27px;line-height:1.1}
.report-stat small{font-size:11px}
.report-panel{min-width:0;padding:16px 18px;border:1px solid #dfe3eb;border-radius:11px;background:#fff}
.report-panel h2{margin:0 0 12px;font-size:17px}
.report-chart{display:flex;align-items:flex-end;justify-content:space-around;gap:12px;min-height:162px;padding:8px 8px 0;border-bottom:1px solid #e3e6ed}
.report-bar-wrap{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0;height:150px}
.report-bar-wrap strong{font-size:11px;color:#28334c}
.report-bar{width:min(54px,75%);min-height:12px;border-radius:5px 5px 0 0;background:#3b4a6b}
.report-bar-wrap span{font-size:11px;color:#687087;white-space:nowrap}
.report-table-wrap{overflow-x:auto}
.report-table{width:100%;border-collapse:collapse;white-space:nowrap}
.report-table th,.report-table td{padding:10px 8px;border-bottom:1px solid #e3e6ed;text-align:left;font-size:12px}
.report-table th{color:#687087;font-weight:600}
.report-table tr:last-child td{border-bottom:0}
.report-table td{color:#3d485c}
.report-table td strong{color:#273246;font-weight:600}
.report-share{display:flex;align-items:center;gap:8px}
.report-share>span{display:block;width:68px;height:7px;overflow:hidden;border-radius:99px;background:#e6e9f0}
.report-share i{display:block;height:100%;border-radius:inherit;background:#3b4a6b}
.report-note{margin:-4px 0 0;color:#778198;font-size:11px}
.idp-project-table{width:100%;border-collapse:collapse;margin-top:4px}
.idp-project-table th,.idp-project-table td{padding:15px 10px;border-bottom:1px solid #dfe3eb;text-align:left;color:#1d2430}
.idp-project-table th{font-size:12px;color:#677184;font-weight:700}
.idp-project-table td{font-size:15px}
.idp-project-table td:nth-child(2),.idp-project-table td:nth-child(3),.idp-project-table td:nth-child(4){color:#48566a}
.idp-note{margin:18px 0 8px;color:#70809a;font-size:12px;font-style:italic}
.idp-alert-card{width:min(440px,100%);padding:16px 18px;border:1px solid #dfe3eb;border-radius:12px;background:#f8f8f9;box-shadow:0 8px 18px rgba(28,38,54,.04)}
.idp-alert-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.idp-alert-head strong{font-size:15px;color:#222b35}
.idp-alert-head button{border:0;background:transparent;color:#69758b;font-size:30px;line-height:1;cursor:pointer;padding:0}
.idp-alert-card p{margin:0;color:#5b6779;font-size:13px;line-height:1.5}
.idp-alert-link{margin-top:12px;border:0;background:transparent;color:#202d40;font-weight:700;font-size:14px;padding:0;cursor:pointer}
@media(max-width:900px){.idp-shell{grid-template-columns:1fr}.idp-sidebar{border-radius:14px 14px 0 0;min-height:unset}.idp-main{border-left:1px solid #dfe3eb;border-radius:0 0 14px 14px}.idp-header{flex-direction:column}.idp-header-actions{justify-content:flex-start}.idp-metrics{grid-template-columns:1fr 1fr}.idp-header h1{font-size:40px}.idp-content-grid{grid-template-columns:1fr}}
@media(max-width:600px){.verification-table-wrap{padding:8px}.verification-dialog form{padding:18px}.verification-details>div{grid-template-columns:100px minmax(0,1fr)}}
@media(max-width:760px){.feedback-filters{grid-template-columns:1fr}.feedback-stat-grid{gap:9px}.feedback-stat{padding:14px}.feedback-panel{padding:12px}}
@media(max-width:760px){.report-datebar{align-items:stretch;flex-direction:column}.report-datebar>#report-export{align-self:flex-end}.report-stat-grid{gap:8px}.report-stat{padding:11px}.report-stat strong{font-size:23px}}
@media(max-width:520px){.report-date-inputs{flex-wrap:wrap}.report-date-inputs input{flex:1;min-width:145px}.report-date-inputs .report-outline-button{padding:0 9px}.report-stat-grid{grid-template-columns:1fr}.report-panel{padding:13px 10px}.report-table th,.report-table td{padding:9px 6px}.report-chart{gap:5px;padding-right:2px;padding-left:2px}.report-bar-wrap span{font-size:9px}}
@media(max-width:580px){.idp-shell{width:min(100% - 24px,1200px)}.idp-main{padding:18px 16px 20px}.idp-metrics{grid-template-columns:1fr}.idp-table th,.idp-table td{padding:14px 8px}.idp-table td{font-size:14px}.idp-table td:nth-child(3),.idp-table td:nth-child(4),.idp-table td:nth-child(5){font-size:13px}.idp-primary-button{width:100%}}
@media(max-width:900px){.designer-profile-content{grid-template-columns:210px minmax(0,1fr)}.designer-portfolio .project-browser-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.project-main-photo{min-height:270px}.designer-profile-heading{grid-template-columns:auto minmax(0,1fr);padding:0 16px 16px}.designer-profile-actions{grid-column:1/-1;grid-row:3;justify-content:flex-end;flex-wrap:wrap}.designer-profile-stats{grid-column:1/-1;grid-row:4;margin:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.designer-profile-content{grid-template-columns:1fr}.designer-profile-sidebar{grid-template-columns:repeat(2,minmax(0,1fr))}.designer-process-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}.designer-process-list li::before{right:-6px}}
@media(max-width:480px){.designer-profile-cover{height:145px}.designer-profile-identity h1{font-size:20px}.designer-profile-sidebar{grid-template-columns:1fr}.designer-profile-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.designer-profile-stats .designer-profile-specialties{grid-column:1/-1}.designer-portfolio .project-browser-grid{grid-template-columns:1fr}.designer-portfolio .browse-project-cover{height:175px}.project-about,.project-enquiry,.project-comments{padding:14px}}
