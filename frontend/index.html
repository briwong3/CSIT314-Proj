<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPU – User Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#3c4a6b; --navy-dark:#1b2033; --bg:#f5f5fa; --card:#fff; --text:#1b2033; --muted:#5b6178;
    --line:#e1e1ea; --pill:#e8e8f2; --gold:#e8c36a; --danger:#b42318; --danger-bg:#fde8e6; --danger-line:#f1aca5;
    --warn-bg:#fdf0d5; --unread:#c2410c; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:14px/1.45 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  h1,h2,h3,p{margin:0}
  a{color:var(--navy)}
  button,input,select,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}

  /* ---------- buttons & fields ---------- */
  button{cursor:pointer;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:8px 14px;font-weight:500}
  button:hover{background:#f0f1f7}
  button.primary{background:var(--navy);color:#fff;font-weight:700}
  button.primary:hover{background:#2f3b58}
  button.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700}
  button.danger:hover{background:#912018}
  button.sm{padding:6px 12px;font-size:13px}
  button:disabled{opacity:.45;cursor:default;pointer-events:none}
  label.f{display:block;font-size:12px;margin:14px 0 5px;color:var(--text)}
  .card label.f:first-child{margin-top:0}
  input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{
    width:100%;background:#fff;border:1px solid #b9bbcb;border-radius:8px;padding:9px 12px}
  textarea{resize:vertical;min-height:84px}
  input::placeholder,textarea::placeholder{color:#8a8fa5}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:-1px}
  .check{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:14px;cursor:pointer}
  .check input{width:18px;height:18px;accent-color:var(--navy);margin:0}

  /* ---------- top bar ---------- */
  .topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:26px;padding:0 32px;height:52px;position:sticky;top:0;z-index:20}
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-weight:700;letter-spacing:.18em;font-size:16px}
  .logo svg{display:block}
  .logo b{color:var(--gold);font-weight:700}
  .logo i{font-style:normal;margin-left:-.12em}
  .nav{display:flex;gap:26px;height:100%}
  .nav a{color:#e4e7f2;text-decoration:none;display:flex;align-items:center;height:100%;border-bottom:2px solid transparent;font-weight:500;padding-top:2px}
  .nav a.active{color:#fff;font-weight:700;border-bottom-color:#fff}
  .grow{flex:1}
  .pill-user{background:var(--pill);color:var(--navy-dark);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:500}
  .topbar .logout{color:#fff;font-size:13px;background:none;border:0;text-decoration:underline;padding:0;font-weight:500}
  .topbar .logout:hover{background:none}
  .topbar .back{color:#fff;font-weight:700;font-size:13px}
  .bell{position:relative;width:36px;height:36px;border-radius:50%;background:#fff;border:0;padding:0;display:grid;place-items:center;color:var(--navy)}
  .bell:hover{background:#fff}
  .badge{position:absolute;top:-3px;right:-3px;background:var(--unread);color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
  .dropdown{position:absolute;top:52px;right:130px;width:320px;background:#fff;color:var(--text);border-radius:12px;box-shadow:0 10px 30px rgba(20,24,50,.2);padding:14px;z-index:30}
  .dropdown .head{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
  .dropdown .head span{font-weight:400;font-size:12px;color:var(--muted)}
  .dd-item{display:block;padding:8px 10px;border-radius:8px;font-size:12px;color:var(--muted);text-align:left;width:100%;border:0;background:none;font-weight:400}
  .dd-item:hover{background:#f5f5fa}
  .dd-item.unread{background:#f3f3f9}
  .dd-item strong{display:block;color:var(--text);font-size:13px;margin-bottom:1px}
  .dd-item .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--navy);margin-right:7px;vertical-align:middle}
  .dropdown .all{display:block;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:700;font-size:13px;text-decoration:none}

  /* ---------- layout ---------- */
  main{max-width:1180px;margin:0 auto;padding:32px 32px 60px}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .page-head h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
  .page-head p{color:var(--muted);margin-top:2px}
  .actions-row{display:flex;gap:10px;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
  .card h2{font-size:17px;margin-bottom:12px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
  .stat{padding:16px 18px}
  .stat small{color:var(--muted);font-size:12px;display:block}
  .stat b{font-size:28px;display:block;line-height:1.2;margin:2px 0}
  .stat span{color:var(--muted);font-size:11px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
  .bars .row{display:flex;align-items:center;gap:14px;padding:7px 0}
  .bars .row strong{width:150px;font-size:13px}
  .bars .track{flex:1;height:8px;border-radius:99px;background:var(--pill);overflow:hidden}
  .bars .fill{height:100%;background:var(--navy);border-radius:99px;min-width:5px}
  .bars .n{width:34px;text-align:right;color:var(--muted)}
  .card .btn-row{margin-top:14px}

  /* ---------- tables ---------- */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:560px}
  th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td.name{font-weight:700}
  td.acts{display:flex;gap:8px;flex-wrap:wrap}
  td small{display:block;color:var(--muted);font-size:12px;font-weight:400}
  .tag{display:inline-block;background:var(--pill);color:var(--navy);font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0;white-space:nowrap}
  .tag.suspended{background:var(--danger-bg);color:#9b1c1c}
  .tag.builtin{font-weight:500}
  .filters{display:grid;grid-template-columns:2.4fr 1.3fr 1fr;gap:16px}
  .filters.audit{grid-template-columns:2fr 1.3fr 1fr 1fr}
  .filters label.f{margin-top:0}
  .pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--muted);font-size:13px}
  .pager div{display:flex;gap:8px}
  .empty{text-align:center;color:var(--muted);padding:28px 0}

  /* ---------- notifications ---------- */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{border-radius:999px;padding:8px 18px;border:1px solid #b9bbcb;background:#fff;color:var(--text);font-weight:500}
  .chip.on{background:var(--navy-dark);border-color:var(--navy-dark);color:#fff}
  .note{display:flex;gap:14px;padding:16px 20px;margin-bottom:14px}
  .note .dotcol{width:8px;padding-top:7px}
  .note .dotcol i{display:block;width:8px;height:8px;border-radius:50%;background:var(--navy)}
  .note .body{flex:1}
  .note h3{font-size:15px;margin-bottom:2px}
  .note p{color:var(--muted);margin-bottom:10px}
  .note .btns{display:flex;gap:8px}
  .note time{color:var(--muted);font-size:12px;white-space:nowrap}

  /* ---------- auth pages ---------- */
  .auth-wrap{display:grid;place-items:start center;padding:38px 20px 60px}
  .auth{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:100%;max-width:346px}
  .auth h1{font-size:22px;margin-bottom:6px}
  .auth .lead{color:var(--muted);margin-bottom:14px;line-height:1.35}
  .auth .between{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
  .auth .between .check{margin:0}
  .auth .big{width:100%;padding:11px;margin-top:6px}
  .auth .alt{text-align:center;margin:14px 0;color:var(--muted)}
  .auth .alt a{font-weight:700}
  .auth .note-box{background:#f3f3f9;color:var(--muted);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.4}
  .alert{background:#ffe9e7;border:1px solid #d96a60;color:#8a1c14;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
  .alert ul{margin:2px 0 0;padding-left:16px}
  .success{background:#e6f6ec;border:1px solid #7cc79a;color:#14532d;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
  .roles{display:grid;gap:8px;margin-bottom:6px}
  .role{display:flex;gap:12px;align-items:flex-start;border:1px solid #c9cbd9;border-radius:10px;padding:12px;cursor:pointer}
  .role input{margin-top:3px;accent-color:var(--navy)}
  .role strong{display:block}
  .role small{color:var(--muted)}
  .role:has(input:checked){background:#e8e8f2;border:2px solid var(--navy);padding:11px}
  .auth label.f{margin:12px 0 5px}

  /* ---------- modal & toast ---------- */
  .overlay{position:fixed;inset:0;background:rgba(27,32,51,.55);display:grid;place-items:center;padding:20px;z-index:50;overflow-y:auto}
  .modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
  .modal.wide{max-width:430px}
  .modal h3{font-size:19px;margin-bottom:10px}
  .modal p{color:var(--muted);line-height:1.4;margin-bottom:6px}
  .modal label.f{margin:12px 0 5px}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
  .modal .hint{font-size:12px;color:var(--muted);margin-top:12px}
  .modal .perms{max-height:300px;overflow-y:auto;margin-top:4px}
  .modal .perms .check{margin:9px 0}
  .modal .err{color:#8a1c14;font-size:13px;margin-top:10px}
  code.temp{display:inline-block;background:#f3f3f9;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:16px;user-select:all;margin-top:6px}
  #toasts{position:fixed;left:24px;bottom:24px;display:grid;gap:10px;z-index:60;max-width:300px}
  .toast{background:#fff;border-left:4px solid var(--navy);border-radius:10px;box-shadow:0 8px 28px rgba(20,24,50,.22);padding:12px 36px 12px 16px;position:relative;font-size:13px}
  .toast strong{display:block;font-size:14px}
  .toast p{color:var(--muted);margin:2px 0 6px}
  .toast a{font-weight:700;text-decoration:none}
  .toast .x{position:absolute;top:8px;right:8px;border:0;background:none;font-size:18px;line-height:1;padding:2px 6px;color:var(--muted)}
  .toast.plain{background:var(--navy-dark);color:#fff;border-left-color:var(--gold);padding-right:16px}
  .loading{color:var(--muted);padding:40px 0;text-align:center}

  @media (max-width:900px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .two{grid-template-columns:1fr}
    .filters,.filters.audit{grid-template-columns:1fr 1fr}
    .topbar{padding:0 16px;gap:16px;overflow-x:auto}
    main{padding:22px 16px 50px}
    .dropdown{right:16px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toasts"></div>

<script>
/* ============================================================
   CPU User Admin front end. Talks to the Flask API on the same origin.
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const human = (code) => { const t = String(code).replace(/_/g, " "); return t.charAt(0).toUpperCase() + t.slice(1); };
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, {day: "numeric", month: "short", year: "numeric"}) : "";
const fmtTime = (iso) => iso ? new Date(iso).toLocaleString(undefined, {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "";
const debounce = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const ACTIONS = {
  create_user: "Created account", update_user: "Edited account", suspend_user: "Suspended account",
  reactivate_user: "Reactivated account", delete_user: "Deleted account", reset_password: "Reset password",
  update_permissions: "Edited profile", create_profile: "Created profile",
};
const actionLabel = (a) => ACTIONS[a] || human(a);

const state = {me: null, perms: [], notes: {unread: 0, notifications: []}, toastShown: false};
const can = (p) => state.perms.includes(p);

/* ---------- API ---------- */
async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: "include",
    headers: {"Content-Type": "application/json"},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 204) return null;
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}
function fail(err) {
  if (err.status === 401 && state.me) { state.me = null; toast("Your session has expired. Please log in again."); location.hash = "#/login"; return; }
  toast(err.message);
}

/* ---------- small UI helpers ---------- */
function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast plain"; el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function openModal(html) { $("#modalRoot").innerHTML = `<div class="overlay">${html}</div>`; const f = $("#modalRoot input:not([disabled]):not([type=checkbox])"); if (f) f.focus(); }
function closeModal() { $("#modalRoot").innerHTML = ""; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

const LOGO = `<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#fff"/><path d="M8 21V13a6 6 0 0 1 12 0v8z" fill="#3c4a6b"/><circle cx="17" cy="16" r="1" fill="#e8c36a"/><rect x="6" y="21" width="16" height="1.6" rx=".8" fill="#9aa3c4"/></svg>`;
const logo = `<a class="logo" href="#/">${LOGO}<span>CP<b>U</b></span></a>`;
const BELL = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`;

/* ---------- router ---------- */
const ROUTES = {
  login: {auth: false, render: pageLogin},
  signup: {auth: false, render: pageSignup},
  dashboard: {auth: true, nav: "dashboard", render: pageDashboard},
  accounts: {auth: true, nav: "accounts", render: pageAccounts},
  profiles: {auth: true, nav: "profiles", render: pageProfiles},
  audit: {auth: true, nav: "audit", render: pageAudit},
  notifications: {auth: true, nav: "notifications", render: pageNotifications},
};
let refresh = () => {};

async function route() {
  closeModal();
  const name = (location.hash.replace(/^#\/?/, "").split("?")[0]) || (state.me ? "dashboard" : "login");
  const r = ROUTES[name];
  if (!r) { location.hash = state.me ? "#/dashboard" : "#/login"; return; }
  if (r.auth && !state.me) { location.hash = "#/login"; return; }
  if (!r.auth && state.me) { location.hash = "#/dashboard"; return; }
  if (r.auth) {
    $("#app").innerHTML = shell(r.nav);
    bindShell();
    refresh = () => r.render($("#page"));
    try { await r.render($("#page")); } catch (err) { fail(err); }
    if (state.pendingUser && name === "accounts") { const u = state.pendingUser; state.pendingUser = null; userModal(u); }
  } else {
    r.render($("#app"));
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- shell (top bar) ---------- */
function shell(active) {
  const nav = [["dashboard", "Dashboard"], ["accounts", "Accounts"], ["profiles", "User profiles"]];
  if (can("view_audit_log")) nav.push(["audit", "Audit log"]);
  return `
  <header class="topbar">
    ${logo}
    <nav class="nav">${nav.map(([k, t]) => `<a href="#/${k}" class="${active === k ? "active" : ""}">${t}</a>`).join("")}</nav>
    <span class="grow"></span>
    ${can("receive_admin_notifications") ? `<button class="bell" id="bell" aria-label="Notifications">${BELL}<span class="badge hidden" id="bellBadge"></span></button>` : ""}
    <span class="pill-user">${esc(state.me.profile)}</span>
    <button class="logout" id="logoutBtn">Log out</button>
  </header>
  <div id="dropdown" class="dropdown hidden"></div>
  <main id="page"><div class="loading">Loading…</div></main>`;
}
function bindShell() {
  $("#logoutBtn").onclick = async () => {
    try { await api("/api/logout", {method: "POST"}); } catch (e) {}
    state.me = null; state.perms = []; state.toastShown = false;
    location.hash = "#/login"; route();
  };
  const bell = $("#bell");
  if (bell) bell.onclick = (e) => { e.stopPropagation(); $("#dropdown").classList.toggle("hidden"); renderDropdown(); };
  updateBadge();
}
document.addEventListener("click", (e) => {
  const dd = $("#dropdown");
  if (dd && !dd.contains(e.target)) dd.classList.add("hidden");
});

/* ---------- notifications (shared) ---------- */
const NOTE_TITLES = {designer_registered: "New interior designer registered"};
const noteTitle = (n) => NOTE_TITLES[n.kind] || human(n.kind);
async function loadNotes() {
  if (!can("receive_admin_notifications")) return;
  try { state.notes = await api("/api/admin/notifications"); } catch (e) { return; }
  updateBadge(); renderDropdown();
}
function updateBadge() {
  const b = $("#bellBadge"); if (!b) return;
  b.textContent = state.notes.unread; b.classList.toggle("hidden", !state.notes.unread);
}
function renderDropdown() {
  const dd = $("#dropdown"); if (!dd) return;
  const list = state.notes.notifications.slice(0, 3);
  dd.innerHTML = `<div class="head">Notifications <span>${state.notes.unread} new</span></div>
    ${list.length ? list.map(n => `<button class="dd-item ${n.is_read ? "" : "unread"}" data-note="${n.id}">
        <strong>${n.is_read ? "" : '<i class="dot"></i>'}${esc(noteTitle(n))}</strong>${esc(n.message)}</button>`).join("")
      : '<div class="empty" style="padding:12px 0">No notifications yet.</div>'}
    <a class="all" href="#/notifications">View all notifications →</a>`;
  dd.querySelectorAll("[data-note]").forEach(b => b.onclick = async () => {
    dd.classList.add("hidden");
    const n = state.notes.notifications.find(x => x.id === +b.dataset.note);
    await reviewNote(n);
  });
}
async function markRead(id) { await api(`/api/admin/notifications/${id}/read`, {method: "POST"}); }
async function reviewNote(n) {
  try {
    if (!n.is_read) await markRead(n.id);
    await loadNotes();
    if (n.related_user_id) {
      const u = await api(`/api/admin/users/${n.related_user_id}`);
      if (location.hash === "#/accounts") userModal(u);
      else { state.pendingUser = u; location.hash = "#/accounts"; }
    } else if (location.hash === "#/notifications") refresh();
  } catch (err) { fail(err); }
}
function showNoteToast() {
  if (state.toastShown) return; state.toastShown = true;
  const n = state.notes.notifications.find(x => !x.is_read); if (!n) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<button class="x" aria-label="Dismiss">×</button><strong>${esc(noteTitle(n))}</strong><p>${esc(n.message)}</p><a href="#" data-r>Review account →</a>`;
  el.querySelector(".x").onclick = () => el.remove();
  el.querySelector("[data-r]").onclick = (e) => { e.preventDefault(); el.remove(); reviewNote(n); };
  $("#toasts").appendChild(el);
}

/* ============================================================
   LOGIN / SIGN UP
   ============================================================ */
let flash = "";
function pageLogin(root) {
  root.innerHTML = `
  <header class="topbar">${logo}</header>
  <div class="auth-wrap"><form class="auth" id="loginForm" novalidate>
    <h1>Log in</h1>
    <p class="lead">Welcome back. You will be taken to the page for your account type.</p>
    ${flash ? `<div class="success">${esc(flash)}</div>` : ""}
    <div id="loginErr"></div>
    <label class="f" for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" value="useradmin1@example.com" autocomplete="username">
    <label class="f" for="password">Password</label>
    <input id="password" type="password" value="Password123!" autocomplete="current-password">
    <div class="between"><label class="check"><input type="checkbox" id="remember"> Remember me</label></div>
    <button class="primary big">Log in</button>
    <p class="alt">New here? <a href="#/signup">Create an account</a></p>
    <div class="note-box">Suspended accounts see: “Your account has been suspended. Please contact the platform.”</div>
  </form></div>`;
  flash = "";

const PAGE = 10;
const aq = {page: 1, name: "", profile: "", status: ""};
let profileList = [];
async function ensureProfiles() {

  return profileList;
}

async function pageAccounts(root) {
  await ensureProfiles();
  root.innerHTML = `
  <div class="page-head">
    <div><h1>User accounts</h1><p>Create, edit, suspend and delete accounts for all four profiles.</p></div>
    <button class="primary" id="newUser">+ Create account</button>
  </div>
  <div class="card">
    <div class="filters">
      <div><label class="f" for="qName">Search</label><input id="qName" type="text" placeholder="Name or email" value="${esc(aq.name)}"></div>
      <div><label class="f" for="qProfile">Profile</label><select id="qProfile"><option value="">All profiles</option>
        ${profileList.map(p => `<option ${aq.profile === p.name ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>
      <div><label class="f" for="qStatus">Status</label><select id="qStatus">
        <option value="">All</option><option value="active" ${aq.status === "active" ? "selected" : ""}>Active</option><option value="suspended" ${aq.status === "suspended" ? "selected" : ""}>Suspended</option></select></div>
    </div>

  </div>`;
  $("#newUser").onclick = () => userModal();
  const reload = debounce(() => { aq.page = 1; loadUsers(); });
  $("#qName").oninput = (e) => { aq.name = e.target.value; reload(); };
  $("#qProfile").onchange = (e) => { aq.profile = e.target.value; aq.page = 1; loadUsers(); };
  $("#qStatus").onchange = (e) => { aq.status = e.target.value; aq.page = 1; loadUsers(); };
  $("#prev").onclick = () => { aq.page--; loadUsers(); };
  $("#next").onclick = () => { aq.page++; loadUsers(); };
  $("#userRows").onclick = onUserAction;
  refresh = loadUsers;
  await loadUsers();
}

let userCache = {};
async function loadUsers() {
  const q = new URLSearchParams({page: aq.page, page_size: PAGE});
  if (aq.name) q.set("name", aq.name);
  if (aq.profile) q.set("profile", aq.profile);
  if (aq.status) q.set("status", aq.status);
  try {
    const d = await api("/api/admin/users?" + q);
    userCache = Object.fromEntries(d.users.map(u => [u.id, u]));
    $("#userRows").innerHTML = d.users.length ? d.users.map(u => `<tr>
      <td class="name">${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.profile)}</td>
      <td><span class="tag ${u.status}">${human(u.status)}</span></td>
      <td class="acts">
        <button class="sm" data-act="edit" data-id="${u.id}">Edit</button>
        <button class="sm" data-act="${u.status === "active" ? "suspend" : "reactivate"}" data-id="${u.id}">${u.status === "active" ? "Suspend" : "Reactivate"}</button>
        <button class="sm" data-act="delete" data-id="${u.id}">Delete</button>
      </td></tr>`).join("") : '<tr><td colspan="5" class="empty">No accounts match your search.</td></tr>';
    const from = d.total ? (aq.page - 1) * PAGE + 1 : 0, to = Math.min(aq.page * PAGE, d.total);
    $("#showing").textContent = `Showing ${from}–${to} of ${d.total}`;
    $("#prev").disabled = aq.page <= 1; $("#next").disabled = aq.page * PAGE >= d.total;
  } catch (err) { fail(err); }
}

async function onUserAction(e) {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const u = userCache[+b.dataset.id];
  try {
    if (b.dataset.act === "edit") userModal(u);
    if (b.dataset.act === "suspend") suspendModal(u);
    if (b.dataset.act === "delete") deleteModal(u);
    if (b.dataset.act === "reactivate") { await api(`/api/admin/users/${u.id}/reactivate`, {method: "POST"}); toast(`${u.name} reactivated`); refresh(); }
  } catch (err) { fail(err); }
}

/* ----- create / edit ----- */
async function userModal(u) {
  await ensureProfiles();
  const edit = !!u;
  const opts = profileList.map(p => `<option ${u && u.profile === p.name ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  openModal(`<form class="modal" id="uForm" novalidate>
    <h3>${edit ? "Edit account" : "Create account"}</h3>
    <label class="f" for="uName">Full name</label><input id="uName" type="text" value="${esc(u?.name)}">
    <label class="f" for="uEmail">Email</label><input id="uEmail" type="email" value="${esc(u?.email)}">
    <label class="f" for="uProfile">Profile</label>
    <select id="uProfile">${edit ? "" : '<option value="">Select a profile</option>'}${opts}</select>
    ${edit ? `<label class="f" for="uStatus">Status</label>
      <select id="uStatus"><option value="active" ${u.status === "active" ? "selected" : ""}>Active</option><option value="suspended" ${u.status === "suspended" ? "selected" : ""}>Suspended</option></select>
      <label class="check"><input type="checkbox" id="uReset"> Reset password (a temporary password is shown once)</label>`
    : `<label class="f" for="uPass">Password (at least 8 characters)</label><input id="uPass" type="password" autocomplete="new-password">
      <label class="check"><input type="checkbox" id="uActive" checked> Account active</label>`}
    <div class="err" id="uErr"></div>
    <div class="foot"><button type="button" id="uCancel">Cancel</button><button class="primary">${edit ? "Save changes" : "Create account"}</button></div>
  </form>`);
  $("#uCancel").onclick = closeModal;
  $("#uForm").onsubmit = async (ev) => {
    ev.preventDefault();
    const body = {name: $("#uName").value, email: $("#uEmail").value, profile: $("#uProfile").value};
    if (!body.profile) { $("#uErr").textContent = "Select a profile."; return; }
    let temp = null;
    try {
      if (edit) {
        await api(`/api/admin/users/${u.id}`, {method: "PUT", body});
        const status = $("#uStatus").value;
        if (status !== u.status) await api(`/api/admin/users/${u.id}/${status === "suspended" ? "suspend" : "reactivate"}`, {method: "POST", body: status === "suspended" ? {reason: "Changed in Edit account"} : undefined});
        if ($("#uReset").checked) temp = (await api(`/api/admin/users/${u.id}/reset-password`, {method: "POST"})).temporary_password;
      } else {
        const made = await api("/api/admin/users", {method: "POST", body: {...body, password: $("#uPass").value}});
        if (!$("#uActive").checked) await api(`/api/admin/users/${made.id}/suspend`, {method: "POST", body: {reason: "Created as inactive"}});
      }
    } catch (err) { $("#uErr").textContent = err.message; return; }
    closeModal();
    if (temp) tempPasswordModal(body.name, temp); else toast(edit ? "Changes saved" : "Account created");
    refresh();
  };
}
function tempPasswordModal(name, temp) {
  openModal(`<div class="modal"><h3>Temporary password</h3>
    <p>Share this with ${esc(name)}. It is shown only once, and they must change it at next login.</p>
    <code class="temp">${esc(temp)}</code>
    <div class="foot"><button class="primary" id="tOk">Done</button></div></div>`);
  $("#tOk").onclick = closeModal;
}

/* ----- suspend ----- */
function suspendModal(u) {
  openModal(`<form class="modal"><h3>Suspend “${esc(u.name)}”?</h3>
    <p>They will not be able to log in. Their favourites, comments and messages are kept, and you can reactivate the account later.</p>
    <label class="f" for="sReason">Reason (saved in the audit log)</label><textarea id="sReason"></textarea>
    <div class="err" id="sErr"></div>
    <div class="foot"><button type="button" id="sCancel">Cancel</button><button class="danger">Suspend account</button></div></form>`);
  $("#sCancel").onclick = closeModal;
  $("#modalRoot form").onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api(`/api/admin/users/${u.id}/suspend`, {method: "POST", body: {reason: $("#sReason").value}});
      closeModal(); toast(`${u.name} suspended`); refresh();
    } catch (err) { $("#sErr").textContent = err.message; }
  };
}

/* ----- delete ----- */
function deleteModal(u) {
  openModal(`<form class="modal wide"><h3>Delete “${esc(u.name)}”?</h3>
    <p>This permanently deletes the account and its favourites, comments and messages. This cannot be undone.${u.status === "active" ? " To block access but keep the data, suspend the account instead." : ""}</p>
    <label class="f" for="dConfirm">Type the account name to confirm</label>
    <input id="dConfirm" type="text" placeholder="${esc(u.name)}" autocomplete="off">
    <div class="err" id="dErr"></div>
    <div class="foot"><button type="button" id="dCancel">Cancel</button>
      ${u.status === "active" ? '<button type="button" id="dSuspend">Suspend instead</button>' : ""}
      <button class="danger" id="dGo" disabled>Delete account</button></div></form>`);
  $("#dCancel").onclick = closeModal;
  if ($("#dSuspend")) $("#dSuspend").onclick = () => suspendModal(u);
  $("#dConfirm").oninput = (e) => { $("#dGo").disabled = e.target.value.trim() !== u.name; };
  $("#modalRoot form").onsubmit = async (e) => {
    e.preventDefault();
    try { await api(`/api/admin/users/${u.id}`, {method: "DELETE"}); closeModal(); toast(`${u.name} deleted`); refresh(); }
    catch (err) { $("#dErr").textContent = err.message; }
  };
}

async function loadLogs() {

    $("#logRows").innerHTML = d.logs.length ? d.logs.map(l => `<tr>
      <td class="name">${fmtTime(l.when)}</td><td>${esc(l.actor)}</td><td>${esc(actionLabel(l.action))}</td>
      <td>${l.target_type ? esc(human(l.target_type)) + (l.target_id ? " #" + l.target_id : "") : "–"}</td><td>${esc(l.details) || "–"}</td></tr>`).join("")
      : '<tr><td colspan="5" class="empty">No log entries match.</td></tr>';
    const from = d.total ? (lq.page - 1) * PAGE + 1 : 0, to = Math.min(lq.page * PAGE, d.total);
    $("#logShowing").textContent = `Showing ${from}–${to} of ${d.total}`;
    $("#lPrev").disabled = lq.page <= 1; $("#lNext").disabled = lq.page * PAGE >= d.total;
  } catch (err) { fail(err); }
}
async function exportCsv() {
  try {
    const rows = [["When", "Done by", "Action", "Target type", "Target id", "Details"]];
    for (let page = 1; page <= 50; page++) {
      const d = await api("/api/admin/audit-logs?" + logQuery(page, 100));
      d.logs.forEach(l => rows.push([l.when, l.actor, actionLabel(l.action), l.target_type, l.target_id ?? "", l.details]));
      if (page * 100 >= d.total) break;
    }
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
    a.download = "audit-log.csv"; a.click(); URL.revokeObjectURL(a.href);
  } catch (err) { fail(err); }
}

/* ============================================================
   NOTIFICATIONS PAGE
   ============================================================ */
let nFilter = "all";
async function pageNotifications(root) {
  if (!can("receive_admin_notifications")) { root.innerHTML = '<div class="card empty">You do not receive admin notifications.</div>'; return; }
  await loadNotes();
  const all = state.notes.notifications;
  const shown = all.filter(n => nFilter === "all" || (nFilter === "unread" && !n.is_read) || (nFilter === "designer" && n.kind === "designer_registered"));
  root.innerHTML = `
  <div class="page-head">
    <div><h1>Notifications</h1><p>Activity that needs the attention of a User Admin.</p></div>
    <button id="readAll" ${state.notes.unread ? "" : "disabled"}>Mark all as read</button>
  </div>
  <div class="chips">
    <button class="chip ${nFilter === "all" ? "on" : ""}" data-f="all">All</button>
    <button class="chip ${nFilter === "unread" ? "on" : ""}" data-f="unread">Unread (${state.notes.unread})</button>
    <button class="chip ${nFilter === "designer" ? "on" : ""}" data-f="designer">Designer sign-ups</button>
  </div>
  ${shown.length ? shown.map(n => `<div class="card note">
    <div class="dotcol">${n.is_read ? "" : "<i></i>"}</div>
    <div class="body"><h3>${esc(noteTitle(n))}</h3><p>${esc(n.message)}</p>
      <div class="btns">
        ${n.related_user_id ? `<button class="sm ${n.is_read ? "" : "primary"}" data-review="${n.id}">Review account</button>` : ""}
        ${n.is_read ? "" : `<button class="sm" data-read="${n.id}">Mark as read</button>`}
      </div></div>
    <time>${fmtTime(n.created_at)}</time></div>`).join("") : '<div class="card empty">Nothing here.</div>'}`;
  root.querySelectorAll(".chip").forEach(c => c.onclick = () => { nFilter = c.dataset.f; pageNotifications(root); });
  root.querySelectorAll("[data-read]").forEach(b => b.onclick = async () => {
    try { await markRead(+b.dataset.read); pageNotifications(root); } catch (err) { fail(err); }
  });
  root.querySelectorAll("[data-review]").forEach(b => b.onclick = () => reviewNote(all.find(n => n.id === +b.dataset.review)));
  $("#readAll").onclick = async () => {
    try { await Promise.all(all.filter(n => !n.is_read).map(n => markRead(n.id))); pageNotifications(root); } catch (err) { fail(err); }
  };
}

/* ---------- boot ---------- */
(async () => {
  try {
    const d = await api("/api/me");
    state.me = d.user; state.perms = d.permissions;
    if (!can("manage_accounts")) { state.me = null; state.perms = []; }
    else await loadNotes();
  } catch (e) {}
  route();
})();
</script>
